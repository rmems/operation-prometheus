# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Draft CodeRabbit config for rmems/operation-prometheus (generated locally, not pushed).
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
  - '!datasets/jsonl/**'
  - '!datasets/inventory/**'
  path_instructions:
  - path: scripts/**/*.py
    instructions: 'Python 3.12 (CI). CI gate: `ruff check scripts/`, `pytest -q`, JSONL schema validation, `python scripts/build_status.py --check`. Keep code compatible with the declared Python floor. Dataset builders must be deterministic (stable ordering, no wall-clock in records) so regenerated JSONL diffs stay reviewable.'
  - path: schemas/**
    instructions: JSON Schemas enforced in CI against `datasets/jsonl/`; breaking schema changes need a migration script (see `scripts/migrate_v0_to_v1.py`) and updated fixtures.
  - path: datasets/{cards,manifests}/**
    instructions: 'Dataset cards/manifests: check licensing/provenance statements and that counts match the generated data.'
  - path: .github/workflows/**
    instructions: GitHub Actions workflows. Keep `permissions:` least-privilege and job commands in sync with the local gates documented in the repo.
  tools:
    ruff:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    pylint:
      enabled: false
    flake8:
      enabled: false
