name: Hugging Face release verify

# Full release gate. Never runs on pull requests and never shares HF_TOKEN
# with PR workflows. Protect the `release` environment so production publishes
# require a reviewer.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable vMAJOR.MINOR.PATCH tag
        required: true
        default: v0.7.0
      dataset_repo:
        description: Hugging Face dataset repo
        required: true
        default: rmems/operation-prometheus-trajectories
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  hf-release-verify:
    runs-on: ubuntu-latest
    environment: release
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet 'jsonschema[format]==4.25.0' 'huggingface_hub'
      - name: Verify JSONL/Parquet checksums, resumable upload, and immutable tags
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          repo="${{ github.event.inputs.dataset_repo }}"
          if [ -z "$repo" ]; then
            repo="rmems/operation-prometheus-trajectories"
          fi
          python scripts/hf_release_verify.py --tag "$tag" --dataset-repo "$repo" --out reports/hf-release-verify.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-release-verify
          path: reports/hf-release-verify.json
          if-no-files-found: error
