name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  # Community Python only. qodana-python-community does not need Qodana Cloud,
  # so this job runs on Dependabot and fork pull requests as well as ordinary
  # ones. The paid Python linter is gone: it required Ultimate Plus, and that
  # membership has expired.
  qodana-python:
    name: Qodana (python)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
        # No QODANA_TOKEN / QODANA_ENDPOINT: Community does not talk to Cloud.
