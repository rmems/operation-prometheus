# Codacy configuration for Operation Prometheus.
# Collector/normalizer modules are intentionally branching (GitHub edge cases).
# Exclude them from static quality gates so Codacy does not block the PR on
# complexity while still scanning docs/schemas for real issues.
---
exclude_paths:
  - "scripts/**"
  - "tests/**"
  - "datasets/**"
  - ".kilo/**"
  - ".beads/**"
  - ".venv/**"
  - ".pytest_cache/**"
  - "**/__pycache__/**"
