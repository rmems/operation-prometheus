# Codacy configuration for Operation Prometheus.
# Keep production pipeline scripts under analysis. Exclude generated data,
# fixtures, caches, and local tooling only.
---
exclude_paths:
  - "tests/**"
  - "datasets/**"
  - ".kilo/**"
  - ".beads/**"
  - ".venv/**"
  - ".pytest_cache/**"
  - "**/__pycache__/**"
