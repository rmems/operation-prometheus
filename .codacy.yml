# Codacy configuration for Operation Prometheus.
#
# Production scripts stay under analysis for security/static checks.
# Cyclomatic-complexity gates (Codacy "metric", default CC limit 8) are excluded
# for intentionally branching collector/normalizer paths; complexity is not a
# useful merge blocker for this pipeline while secrets/security still scan.
---
exclude_paths:
  - "tests/**"
  - "datasets/**"
  - ".kilo/**"
  - ".beads/**"
  - ".venv/**"
  - ".pytest_cache/**"
  - "**/__pycache__/**"

engines:
  metric:
    exclude_paths:
      - "scripts/**"
